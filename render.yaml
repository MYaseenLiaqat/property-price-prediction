services:
  - type: web
    name: estateiq-lahore
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/provision_model.py && python -m backend.main
    healthCheckPath: /health
    envVars:
      - key: MODEL_ARTIFACT_URL
        sync: false
      - key: MODEL_ARTIFACT_SHA256
        sync: false
